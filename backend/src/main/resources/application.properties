spring.application.name=backend

# Local Maven executions from backend/ may load the repository-root .env.
# Explicit environment variables and Docker Compose values take precedence.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3309}/wod_explorer_2
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


app.frontend-url=${FRONTEND_URL:http://localhost:5174}